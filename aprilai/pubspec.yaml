name: aprilai
description: "April AI - Cross-platform productivity assistant with role-based adaptive UI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  flutter_markdown: ^0.7.6
  google_fonts: ^6.2.1
  intl: ^0.20.1
  http: ^1.2.2
  flutter_animate: ^4.5.0
  lottie: ^3.1.3
  gap: ^3.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
